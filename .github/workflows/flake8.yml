name: Code Quality Checks

on:
  # 支持手动触发
  workflow_dispatch:
    inputs:
      reason:
        description: 'Run reason'
        required: false
        default: 'Manual check'
  # 支持push和pull request触发
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'
    
    - name: Install flake8
      run: pip install flake8
    
    - name: Run flake8
      run: python -m flake8 . --exclude=github-checker-检测状态,trace,__pycache__,.git
    
    - name: Run service lines check
      run: python check_service_lines.py
